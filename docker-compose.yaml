services:
  app:
    build: .
    container_name: my-api
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: my-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: er_editor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d er_editor"]
      interval: 5s
      timeout: 3s
      retries: 10